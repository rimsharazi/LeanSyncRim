<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeanSync</title>
    <link rel="stylesheet" href="style.css">
    <!-- Production-ready web library for our charts -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ LeanSync</h1>
            <p>Body Recomposition Tracker & Analytics Dashboard</p>
        </header>

        <!-- SETUP SECTION -->
        <section class="card">
            <h2>1. Profile Setup & Recomp Targets</h2>
            <form id="profileForm">
                <div class="grid-3">
                    <label>Weight (lbs): <input type="number" id="weight" required value="180"></label>
                    <label>Height (cm): <input type="number" id="height" required value="175"></label>
                    <label>Age: <input type="number" id="age" required value="25"></label>
                </div>
                <div class="grid-2">
                    <label>Gender: 
                        <select id="gender">
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </label>
                    <label>Activity Level: 
                        <select id="activity">
                            <option value="sedentary">Sedentary (Office job)</option>
                            <option value="light">Light (1-3 days/wk)</option>
                            <option value="moderate" selected>Moderate (3-5 days/wk)</option>
                            <option value="very">Very Active (6-7 days/wk)</option>
                        </select>
                    </label>
                </div>
                <button type="button" onclick="calculateRecomp()">Calculate Recomp Targets</button>
            </form>

            <div id="recompTargets" class="hidden target-box">
                <h3>Your Calculated Daily Targets</h3>
                <div class="grid-4">
                    <div class="stat">⚡ <span id="targetCals">0</span> kcal</div>
                    <div class="stat">🥩 <span id="targetProtein">0</span>g P</div>
                    <div class="stat">🥑 <span id="targetFats">0</span>g F</div>
                    <div class="stat">🍚 <span id="targetCarbs">0</span>g C</div>
                </div>
            </div>
        </section>

        <!-- DAILY LOG SECTION -->
        <section class="card">
            <h2>2. Daily Log Input</h2>
            <form id="logForm">
                <div class="grid-4">
                    <label>Weight (lbs): <input type="number" step="0.1" id="logWeight" required></label>
                    <label>Protein (g): <input type="number" id="logProtein" required></label>
                    <label>Carbs (g): <input type="number" id="logCarbs" required></label>
                    <label>Fats (g): <input type="number" id="logFats" required></label>
                </div>
                <button type="button" onclick="logDailyData()">Save Daily Entry</button>
            </form>
        </section>

        <!-- VISUAL PROGRESS TREND -->
        <section class="card">
            <h2>3. 7-Day Weight Moving Average Trend</h2>
            <canvas id="weightChart"></canvas>
        </section>

        <!-- HISTORY LOG SECTION -->
        <section class="card">
            <h2>4. History Log & Averages</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Scale Weight</th>
                            <th>7-Day Moving Avg</th>
                            <th>Calories Eaten</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
            <button class="danger-btn" onclick="clearData()">Clear All Local Storage Data</button>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
